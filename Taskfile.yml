version: '3'
tasks:
  get-deps:
    cmds:
      - go get github.com/mattn/go-colorable

  win:build:
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - go build -o ./bin/taskmenu.exe ./cmd/taskmenu

  linux:build:
    env:
      GOOS: linux
      GOARCH: amd64
    cmds:
      - go build -o ./bin/taskmenu ./cmd/taskmenu

  package:
    platforms: [windows]
    cmds:
      - task: get-deps
      - task: win:build
      - task: linux:build
      - cmd: powershell -NoProfile -Command "Remove-Item -Path './bin/taskmenu-windows-amd64.zip' -ErrorAction SilentlyContinue"
        ignore_error: true
      - cmd: powershell -NoProfile -Command "Remove-Item -Path './bin/taskmenu-linux-amd64.zip' -ErrorAction SilentlyContinue"
        ignore_error: true
      - powershell -NoProfile -Command "Compress-Archive -Path './bin/taskmenu.exe' -DestinationPath './bin/taskmenu-windows-amd64.zip' -Force"
      - powershell -NoProfile -Command "Compress-Archive -Path './bin/taskmenu' -DestinationPath './bin/taskmenu-linux-amd64.zip' -Force"