version: '3'
tasks:
  get-deps:
    cmds:
      - go get github.com/mattn/go-colorable

  build:
    deps: [get-deps]
    cmds:
      - go build -o ./bin/taskmenu{{exeExt}} ./cmd/taskmenu

  wsl:build:
    platforms: [windows]
    deps: [get-deps]
    cmds:
      - wsl go build -o ./bin/taskmenu ./cmd/taskmenu

  wsl:zip:
    platforms: [windows]
    deps: [wsl:build]
    cmds:
      - wsl rm -f ./bin/taskmenu-linux-amd64.zip
      - wsl zip -j ./bin/taskmenu-linux-amd64.zip ./bin/taskmenu

  win:zip:
    platforms: [windows]
    deps: [build]
    cmds:
      - cmd: powershell -NoProfile -Command "Remove-Item -Path './bin/taskmenu-{{OS}}-{{ARCH}}.zip' -ErrorAction SilentlyContinue"
        ignore_error: true
      - powershell -NoProfile -Command "Compress-Archive -Path './bin/taskmenu.exe' -DestinationPath './bin/taskmenu-{{OS}}-{{ARCH}}.zip' -Force"

  package:
    deps: [win:zip,wsl:zip]